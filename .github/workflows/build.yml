name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  engine:
    name: Движок LÖVE Potion для Switch
    runs-on: ubuntu-latest
    container:
      image: docker://devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lovebrew/lovepotion
          ref: 906511d4e05b47015da5bf85ad554fe6542b1c81

      - name: Сборка
        run: catnip -T Switch -DLIBRARY_LOADER='linktime' -DUSE_CURL_BACKEND=ON

      - name: Найти lovepotion.nro
        run: |
          mkdir -p out
          NRO=$(find build -name 'lovepotion.nro' | head -n1)
          test -n "$NRO"
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  engine:
    name: Движок LÖVE Potion для Switch
    runs-on: ubuntu-latest
    container:
      image: docker://devkitpro/devkita64
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lovebrew/lovepotion
          ref: 906511d4e05b47015da5bf85ad554fe6542b1c81

      - name: Сборка
        run: catnip -T Switch -DLIBRARY_LOADER='linktime' -DUSE_CURL_BACKEND=ON

      - name: Найти lovepotion.nro
        run: |
          mkdir -p out
          NRO=$(find build -name 'lovepotion.nro' | head -n1)
          test -n "$NRO"
          cp "$NRO" out/lovepotion.nro
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: out/lovepotion.nro

  apk:
    name: APK
    needs: engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Распаковать project.zip
        run: |
          if [ -f project.zip ] && [ ! -f settings.gradle.kts ]; then
            unzip -o project.zip
            if [ -d nro-maker ]; then cp -r nro-maker/. . ; fi
          fi

      - name: Удалить старые Kotlin-файлы
        run: rm -f app/src/main/java/com/nromaker/*.kt

      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: app/src/main/assets

      - name: Проверить движок
        run: ls -l app/src/main/assets && test -s app/src/main/assets/lovepotion.nro

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Принять лицензии Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Сборка
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NroMaker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
 test -s app/src/main/assets/lovepotion.nro

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Сборка
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NroMaker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
